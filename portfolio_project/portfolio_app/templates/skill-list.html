{% extends 'master/base.html' %}

{% block content %}
{% if request.user.is_authenticated %}
  <a href="{% url 'add_skill' %}" class="btn btn-edit">Add Skill</a>
  {% endif %}

  <div class="card-container">
    {% for data in skill_data %}
      <div class="card">
        <div class="card-content">
          <div class="card-title">{{ data.name }}</div>
        </div>
        {% if request.user.is_authenticated %}
        <div class="card-actions">
          <a href="{% url 'edit_skill' data.id %}" class="btn btn-edit">Edit</a>
          <a href="{% url 'delete_skill' data.id %}" class="btn btn-delete">Delete</a>
        </div>
        {% endif %}
      </div>
    {% endfor %}
  </div>
{% endblock %}
