<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>New Get In Touch Info</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f8fa;
            margin: 0;
            padding: 0;
        }
        .email-container {
            background-color: #ffffff;
            max-width: 600px;
            margin: 30px auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background-color: #2563eb;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        .header h2 {
            margin: 0;
            font-size: 22px;
        }
        .content {
            padding: 20px;
        }
        .content h3 {
            margin-top: 0;
            color: #2563eb;
        }
        .details-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .details-table td {
            padding: 8px;
            border-bottom: 1px solid #f0f0f0;
        }
        .details-table td:first-child {
            font-weight: bold;
            width: 40%;
            color: #333333;
        }
        .details-table td:last-child {
            color: #555555;
        }
        .footer {
            background-color: #f7f8fa;
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #777777;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- Header -->
        <div class="header">
            <h2>📄 Account Confirmation Info</h2>
        </div>

        <!-- Content -->
        <div class="content">
            <table class="details-table">
                <tr>
                    <td>Username</td>
                    <td>{{ username }}</td>
                </tr>
                <tr>
                    <td>Email</td>
                    <td>{{ email }}</td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td>{{ password }}</td>
                </tr>
        
            </table>

            
        </div>

        <!-- Footer -->
        <div class="footer">
            <p style="margin-top: 15px; font-size: 14px; color: #555;">This Get In Touch information came form the "Agarwal Tibrewal & Co" Website.</p>
        </div>
    </div>
</body>
</html>
