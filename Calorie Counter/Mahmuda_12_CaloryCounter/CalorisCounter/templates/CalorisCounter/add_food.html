{% extends 'CalorisCounter/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4">
            <h2 class="mb-4 text-center" style="color: #1e3c72;">Add Food Entry</h2>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 py-2 mt-3">Add Food</button>
            </form>
            <div class="mt-3 text-center">
                <a href="{% url 'dashboard' %}" class="text-muted">Back to Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
