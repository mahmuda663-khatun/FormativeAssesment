<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body{
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f2f2f2;
        font-family: Arial, sans-serif;
    }

    .login-box{
        width: 320px;
        padding: 30px;
        background: #ffffff;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        border-radius: 8px;
    }

    .login-box h2{
        text-align: center;
        margin-bottom: 20px;
        font-weight: normal;
    }

    .login-box input{
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 4px;
        outline: none;
        font-size: 14px;
    }

    .login-box input:focus{
        border-color: #333;
    }

    .login-box button{
        width: 100%;
        padding: 10px;
        border: none;
        background: #333;
        color: #fff;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
    }

    .login-box button:hover{
        background: #000;
    }

    .login-box p{
        text-align: center;
        font-size: 13px;
        margin-top: 15px;
    }

    .login-box a{
        text-decoration: none;
        color: #333;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="login-box">
    <h2>Login</h2>
    {% include "master/messages.html" %}
    <form method="POST">
    {% csrf_token %}
        
        <input type="text" name="username" placeholder="username" required>
        
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
</div>

</body>
</html>
